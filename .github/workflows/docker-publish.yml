name: Build and Push Docker Image

on:
  push:
    branches:
      - v2
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ${{ vars.REGISTRY }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME || 'pxz' }}

jobs:
  build-and-push:
    if: ${{ github.ref == 'refs/heads/v2' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Prepare image metadata
        id: metadata
        shell: bash
        run: |
          if [[ -z "$REGISTRY" ]]; then
            echo "::error::Set the REGISTRY repository variable in Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf 'short_sha=%s\n' "${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to private registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.metadata.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show published image
        shell: bash
        env:
          COMMIT_SHA: ${{ steps.metadata.outputs.short_sha }}
        run: |
          printf 'Published image: `%s/%s:%s`\n' "$REGISTRY" "$IMAGE_NAME" "$COMMIT_SHA" >> "$GITHUB_STEP_SUMMARY"
